name: tests

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

# A newer push to the same branch replaces the run in progress.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  spells:
    name: spells (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: cachix/install-nix-action@3dc140bfc76c49fbd4dd958429132e3746bcb086 # v31.11.5
      - run: tests/run
      - name: Run the tests again through the cache wrapper
        run: PATH="$PWD/shims:$PATH" tests/run
